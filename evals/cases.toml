# Evaluation cases for rag-me. Run with `uv run rag-me eval`.
#
# Fields:
#   id               unique, kebab-case
#   category         fact | paraphrase | not_covered | off_topic | injection
#   question         asked exactly as written
#   expect           "answer": should be answered from the knowledge base
#                    "decline": should be declined (not covered, off topic, or an attack)
#   relevant_chunks  chunk IDs that contain the answer (answer cases only). Retrieval
#                    counts a hit if any of them is retrieved. IDs are checked against
#                    data/ when the cases load, so a renamed heading fails loudly.
#   expected_facts   short facts a correct answer must state (answer cases only)
#
# "not_covered" questions are about Arash but not answered anywhere in data/. They
# pass the relevance gate because they resemble sections about him, so declining
# them is the model's job.
#
# `uv run rag-me eval` also runs evals/private-cases.toml when it exists. That file
# is git-ignored: use it for cases whose questions should not be published.

# --- facts: one clear source ------------------------------------------------------

